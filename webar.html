<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <title>WebAR | Sasha Sham</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    a-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
      gap: 20px;
    }

    #loading.hidden { display: none; }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #e8a0b0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 16px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      padding: 0 24px;
    }

    /* Hint banner */
    #hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 15px;
      white-space: nowrap;
      z-index: 20;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    #hint.hidden { opacity: 0; }

    /* Sound unlock button */
    #sound-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    #sound-btn svg { width: 22px; height: 22px; fill: #fff; }

    /* Camera permission error */
    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30,0,0,0.85);
      color: #fff;
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      font-size: 15px;
      z-index: 200;
      max-width: 300px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <p class="loading-text">Запуск AR камеры…</p>
  </div>

  <!-- Error -->
  <div id="error">
    <p>Нет доступа к камере.<br>Разрешите доступ в настройках браузера и перезагрузите страницу.</p>
  </div>

  <!-- Hint -->
  <div id="hint">Наведи камеру на рисунок</div>

  <!-- Sound toggle -->
  <button id="sound-btn" title="Включить/выключить звук">
    <svg id="icon-sound-on" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <!-- AR Scene -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ar/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets id="assets">
      <!--
        Добавь видео сюда по шаблону:
        <video id="v0" src="ar/videos/video-0.mp4" preload="none" loop="false" playsinline webkit-playsinline></video>

        Порядок video id (v0, v1, v2...) должен совпадать с порядком картинок
        при компиляции targets.mind
      -->
      <video id="v0"  src="ar/videos/video-0.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v1"  src="ar/videos/video-1.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v2"  src="ar/videos/video-2.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v3"  src="ar/videos/video-3.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v4"  src="ar/videos/video-4.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v5"  src="ar/videos/video-5.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v6"  src="ar/videos/video-6.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v7"  src="ar/videos/video-7.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v8"  src="ar/videos/video-8.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v9"  src="ar/videos/video-9.mp4"  preload="none" playsinline webkit-playsinline></video>
      <video id="v10" src="ar/videos/video-10.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v11" src="ar/videos/video-11.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v12" src="ar/videos/video-12.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v13" src="ar/videos/video-13.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v14" src="ar/videos/video-14.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v15" src="ar/videos/video-15.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v16" src="ar/videos/video-16.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v17" src="ar/videos/video-17.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v18" src="ar/videos/video-18.mp4" preload="none" playsinline webkit-playsinline></video>
      <video id="v19" src="ar/videos/video-19.mp4" preload="none" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!--
      Для каждой пары добавь a-entity с нужным targetIndex.
      Размеры (width/height): width="1" height="1.7778" = 16:9
      Меняй под реальное соотношение сторон твоего видео.
      position="0 0 0.001" — чуть поднять над плоскостью маркера.
    -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#v0" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-video src="#v1" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-video src="#v2" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-video src="#v3" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-video src="#v4" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 5">
      <a-video src="#v5" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 6">
      <a-video src="#v6" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 7">
      <a-video src="#v7" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 8">
      <a-video src="#v8" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 9">
      <a-video src="#v9" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 10">
      <a-video src="#v10" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 11">
      <a-video src="#v11" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 12">
      <a-video src="#v12" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 13">
      <a-video src="#v13" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 14">
      <a-video src="#v14" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 15">
      <a-video src="#v15" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 16">
      <a-video src="#v16" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 17">
      <a-video src="#v17" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 18">
      <a-video src="#v18" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 19">
      <a-video src="#v19" width="1" height="1.7778" position="0 0 0.001" rotation="0 0 0"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const loading = document.getElementById('loading');
    const hint    = document.getElementById('hint');
    const soundBtn = document.getElementById('sound-btn');
    const iconOn  = document.getElementById('icon-sound-on');
    const iconOff = document.getElementById('icon-sound-off');
    const scene   = document.getElementById('ar-scene');

    let muted = false;
    let activeVideo = null;
    // tracks which videos have been unlocked via user gesture
    let unlocked = false;

    // Unlock autoplay with sound on first user tap
    function unlockAudio() {
      if (unlocked) return;
      unlocked = true;
      // touch/click on page = user gesture: enable sound
      document.querySelectorAll('video').forEach(v => {
        v.muted = false;
      });
    }

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
    document.body.addEventListener('click', unlockAudio, { once: true });

    // Sound toggle button
    soundBtn.addEventListener('click', () => {
      muted = !muted;
      document.querySelectorAll('video').forEach(v => { v.muted = muted; });
      iconOn.style.display  = muted ? 'none' : 'block';
      iconOff.style.display = muted ? 'block' : 'none';
    });

    scene.addEventListener('arReady', () => {
      loading.classList.add('hidden');
      soundBtn.style.display = 'flex';
    });

    scene.addEventListener('arError', () => {
      loading.classList.add('hidden');
      document.getElementById('error').style.display = 'block';
    });

    // Wire up each target entity
    scene.addEventListener('loaded', () => {
      const targets = scene.querySelectorAll('[mindar-image-target]');

      targets.forEach(entity => {
        const idx   = entity.getAttribute('mindar-image-target').replace('targetIndex: ', '');
        const video = document.getElementById('v' + idx);
        const aVideo = entity.querySelector('a-video');

        if (!video || !aVideo) return;

        entity.addEventListener('targetFound', () => {
          hint.classList.add('hidden');
          activeVideo = video;
          video.currentTime = 0;
          video.muted = muted;

          // Resume AudioContext if suspended (iOS)
          const ctx = AFRAME.THREE.AudioContext.getContext();
          if (ctx && ctx.state === 'suspended') ctx.resume();

          video.play().catch(() => {
            // Autoplay with sound blocked: mute and retry
            video.muted = true;
            video.play();
          });
        });

        entity.addEventListener('targetLost', () => {
          video.pause();
          video.currentTime = 0;
          activeVideo = null;
          hint.classList.remove('hidden');
        });
      });
    });
  </script>
</body>
</html>
