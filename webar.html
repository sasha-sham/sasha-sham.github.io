<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <title>WebAR | Sasha Sham</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    a-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* Splash — tap to start (required for iOS video unlock) */
    #splash {
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 200;
      color: #fff;
    }

    #splash.hidden { display: none; }

    #splash h2 {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      padding: 0 24px;
    }

    #splash p {
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      text-align: center;
      padding: 0 32px;
      line-height: 1.5;
    }

    #start-btn {
      background: #e8a0b0;
      color: #fff;
      border: none;
      border-radius: 32px;
      padding: 16px 48px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

    /* Loading (shown after tap while MindAR initialises) */
    #loading {
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 150;
      color: #fff;
    }

    #loading.visible { display: flex; }
    #loading.hidden  { display: none; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #e8a0b0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hint */
    #hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 15px;
      white-space: nowrap;
      z-index: 20;
      opacity: 1;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    #hint.hidden { opacity: 0; }

    /* Sound button */
    #sound-btn {
      position: fixed;
      top: 24px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #sound-btn svg { width: 22px; height: 22px; fill: #fff; }

    /* Error */
    #error {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30,0,0,0.9);
      color: #fff;
      padding: 24px 28px;
      border-radius: 16px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      z-index: 300;
      max-width: 300px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Step 1: tap to start (unlocks iOS video autoplay) -->
  <div id="splash">
    <h2>WebAR</h2>
    <p>Наведи камеру на рисунок и смотри, как он оживает</p>
    <button id="start-btn">Начать</button>
  </div>

  <!-- Step 2: loading after tap -->
  <div id="loading">
    <div class="spinner"></div>
    <p style="font-size:15px;color:rgba(255,255,255,0.75)">Запуск камеры…</p>
  </div>

  <!-- Error -->
  <div id="error">
    <p>Нет доступа к камере.<br>Разрешите доступ в настройках и перезагрузите страницу.</p>
  </div>

  <!-- Hint -->
  <div id="hint">Наведи камеру на рисунок</div>

  <!-- Sound toggle -->
  <button id="sound-btn" aria-label="Звук">
    <svg id="icon-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <svg id="icon-off" viewBox="0 0 24 24" style="display:none">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <!-- AR Scene — autoStart: false, запускается вручную после разблокировки видео -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ar/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.00001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!--
        Порядок видео (v0…v19) должен совпадать с порядком картинок
        при компиляции targets.mind
      -->
      <video id="v0"  src="ar/videos/video-0.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v1"  src="ar/videos/video-1.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v2"  src="ar/videos/video-2.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v3"  src="ar/videos/video-3.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v4"  src="ar/videos/video-4.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v5"  src="ar/videos/video-5.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v6"  src="ar/videos/video-6.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v7"  src="ar/videos/video-7.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v8"  src="ar/videos/video-8.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v9"  src="ar/videos/video-9.mp4"  muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v10" src="ar/videos/video-10.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v11" src="ar/videos/video-11.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v12" src="ar/videos/video-12.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v13" src="ar/videos/video-13.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v14" src="ar/videos/video-14.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v15" src="ar/videos/video-15.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v16" src="ar/videos/video-16.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v17" src="ar/videos/video-17.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v18" src="ar/videos/video-18.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
      <video id="v19" src="ar/videos/video-19.mp4" muted loop playsinline webkit-playsinline preload="metadata"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!--
      a-plane с shader: flat — видео без затемнения от освещения сцены.
      width / height = 1.1 / 1.65 — пропорция 2:3 + overscan ~10%,
      чтобы overlay полностью перекрывал исходную картинку.
    -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane src="#v0" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v0"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-plane src="#v1" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v1"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-plane src="#v2" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v2"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-plane src="#v3" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v3"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-plane src="#v4" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v4"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 5">
      <a-plane src="#v5" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v5"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 6">
      <a-plane src="#v6" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v6"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 7">
      <a-plane src="#v7" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v7"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 8">
      <a-plane src="#v8" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v8"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 9">
      <a-plane src="#v9" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v9"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 10">
      <a-plane src="#v10" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v10"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 11">
      <a-plane src="#v11" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v11"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 12">
      <a-plane src="#v12" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v12"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 13">
      <a-plane src="#v13" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v13"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 14">
      <a-plane src="#v14" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v14"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 15">
      <a-plane src="#v15" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v15"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 16">
      <a-plane src="#v16" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v16"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 17">
      <a-plane src="#v17" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v17"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 18">
      <a-plane src="#v18" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v18"></a-plane>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 19">
      <a-plane src="#v19" width="1.1" height="1.65" position="0 0 0.001" material="shader: flat; src: #v19"></a-plane>
    </a-entity>

  </a-scene>

  <script>
    const splash   = document.getElementById('splash');
    const loading  = document.getElementById('loading');
    const hint     = document.getElementById('hint');
    const soundBtn = document.getElementById('sound-btn');
    const iconOn   = document.getElementById('icon-on');
    const iconOff  = document.getElementById('icon-off');
    const scene    = document.getElementById('ar-scene');
    const videos   = Array.from(document.querySelectorAll('video'));

    const startBtn = document.getElementById('start-btn');

    let soundOn       = true;
    let activeVideo   = null;
    let sceneReady    = false;
    let pendingStart  = false;

    scene.addEventListener('arReady', () => {
      loading.classList.remove('visible');
      loading.classList.add('hidden');
      soundBtn.style.display = 'flex';
    });

    scene.addEventListener('arError', () => {
      loading.classList.remove('visible');
      loading.classList.add('hidden');
      document.getElementById('error').style.display = 'block';
    });

    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      if (activeVideo) activeVideo.muted = !soundOn;
      iconOn.style.display  = soundOn ? 'block' : 'none';
      iconOff.style.display = soundOn ? 'none'  : 'block';
    });

    // Start button is wired immediately so the very first tap is never lost.
    // If the user taps before MindAR finishes loading, we mark pendingStart
    // and kick off the engine as soon as it's ready.
    const beginAr = () => {
      splash.classList.add('hidden');
      loading.classList.add('visible');
      // Prime every video during the user gesture so iOS can play() them
      // later (on targetFound) without a fresh gesture. Muted play+pause
      // satisfies WebKit's autoplay rules without keeping decoders warm.
      videos.forEach(v => {
        v.muted = true;
        const p = v.play();
        if (p && typeof p.then === 'function') {
          p.then(() => v.pause()).catch(() => {});
        }
      });
      scene.systems['mindar-image-system'].start();
    };

    startBtn.addEventListener('click', () => {
      if (sceneReady) {
        beginAr();
      } else {
        pendingStart = true;
        loading.classList.add('visible');
      }
    });

    scene.addEventListener('loaded', () => {
      sceneReady = true;

      scene.querySelectorAll('[mindar-image-target]').forEach(entity => {
        const idx   = entity.getAttribute('mindar-image-target').targetIndex;
        const video = document.getElementById('v' + idx);
        if (!video) return;

        entity.addEventListener('targetFound', () => {
          hint.classList.add('hidden');
          activeVideo = video;
          video.currentTime = 0;
          video.muted = !soundOn;
          video.play().catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        });

        entity.addEventListener('targetLost', () => {
          video.pause();
          video.muted = true;
          video.currentTime = 0;
          activeVideo = null;
          hint.classList.remove('hidden');
        });
      });

      if (pendingStart) {
        pendingStart = false;
        beginAr();
      }
    });
  </script>
</body>
</html>
