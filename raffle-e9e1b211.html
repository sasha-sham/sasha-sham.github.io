<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>Розыгрыш</title>
<style>
  :root{
    --bg1:#150a1f;
    --bg2:#2a0f33;
    --accent:#ff69b4;
    --accent2:#a259ff;
    --card:#1e1029;
    --text:#f5eaff;
    --muted:#b9a7c9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1) 60%);
    color:var(--text);
    overflow:hidden;
    padding:24px;
  }
  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background:rgba(30,16,41,0.75);
    border:1px solid rgba(255,105,180,0.25);
    border-radius:24px;
    padding:36px 28px 32px;
    backdrop-filter:blur(10px);
    box-shadow:0 20px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset;
    text-align:center;
    z-index:2;
  }
  h1{
    font-size:22px;
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 26px;
  }
  .row{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }
  label{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  input[type=number]{
    width:80px;
    padding:10px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06);
    color:var(--text);
    font-size:16px;
    text-align:center;
    outline:none;
  }
  input[type=number]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,105,180,0.2);
  }
  .stage{
    position:relative;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
  }
  .result{
    font-size:84px;
    font-weight:800;
    line-height:1;
    background:linear-gradient(180deg,#fff,var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 18px rgba(255,105,180,0.35));
    transition:transform .08s ease;
  }
  .result.placeholder{
    font-size:22px;
    color:var(--muted);
    -webkit-text-fill-color:var(--muted);
    background:none;
    filter:none;
    font-weight:500;
  }
  .result.rolling{
    animation:pulse .08s linear infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
  }
  button{
    appearance:none;
    border:none;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    padding:14px 32px;
    border-radius:14px;
    color:#160a1e;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow:0 10px 24px rgba(255,105,180,0.3);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,105,180,0.4);}
  button:active{transform:translateY(0);}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .hint{
    margin-top:16px;
    font-size:11px;
    color:var(--muted);
    opacity:.7;
  }
  canvas#confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
  }
  .err{
    color:#ff8fb3;
    font-size:12px;
    min-height:16px;
    margin-top:-12px;
    margin-bottom:14px;
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="card">
  <h1>Честный розыгрыш</h1>
  <p class="sub">Введи число участников (1–20) и получи случайный номер-победитель</p>

  <div class="row">
    <label for="maxN">Участников:</label>
    <input id="maxN" type="number" min="1" max="20" value="20" inputmode="numeric">
  </div>
  <div class="err" id="err"></div>

  <div class="stage">
    <div class="result placeholder" id="result">?</div>
  </div>

  <button id="rollBtn">Крутить</button>
  <p class="hint">Криптографически случайный выбор без смещения (rejection sampling)</p>
</div>

<script>
(function(){
  "use strict";

  function secureRandomInt(max){
    if(!Number.isInteger(max) || max < 1) throw new Error("bad max");
    const range = max;
    let bytesNeeded = 1;
    while (256 ** bytesNeeded < range) bytesNeeded++;
    const maxValid = Math.floor(256 ** bytesNeeded / range) * range - 1;
    let rand;
    const buf = new Uint8Array(bytesNeeded);
    do {
      crypto.getRandomValues(buf);
      rand = 0;
      for (let i = 0; i < bytesNeeded; i++) rand += buf[i] * 256 ** i;
    } while (rand > maxValid);
    return (rand % range) + 1;
  }

  const maxInput = document.getElementById("maxN");
  const resultEl = document.getElementById("result");
  const rollBtn = document.getElementById("rollBtn");
  const errEl = document.getElementById("err");

  function validate(){
    const v = parseInt(maxInput.value, 10);
    if(!Number.isInteger(v) || v < 1 || v > 20){
      errEl.textContent = "Введите целое число от 1 до 20";
      return null;
    }
    errEl.textContent = "";
    return v;
  }

  maxInput.addEventListener("input", validate);

  rollBtn.addEventListener("click", function(){
    const max = validate();
    if(max === null) return;

    rollBtn.disabled = true;
    resultEl.classList.remove("placeholder");
    resultEl.classList.add("rolling");

    const spins = 18 + Math.floor(Math.random() * 6);
    let i = 0;
    const interval = setInterval(function(){
      resultEl.textContent = secureRandomInt(max);
      i++;
      if(i >= spins){
        clearInterval(interval);
        const final = secureRandomInt(max);
        resultEl.textContent = final;
        resultEl.classList.remove("rolling");
        rollBtn.disabled = false;
        confettiBurst();
      }
    }, 60);
  });

  // Minimal self-contained confetti burst, no external libs.
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  let particles = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const colors = ["#ff69b4", "#a259ff", "#ffd166", "#ffffff", "#ff9ecf"];

  function confettiBurst(){
    const count = 90;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2 - 60;
    for(let i=0;i<count;i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 6;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 4 + Math.random() * 5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5) * 0.3,
        life: 0,
        maxLife: 70 + Math.random()*40
      });
    }
  }

  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles = particles.filter(p => p.life < p.maxLife);
    for(const p of particles){
      p.vy += 0.12;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      const alpha = 1 - p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = Math.max(alpha, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
